# Runs the whole update chain in GitHub's cloud every week, then publishes the
# pages. This is what moves CivicAlign off a laptop: nothing here depends on any
# machine being switched on.
#
# Order is the safety mechanism, same as scripts/update.sh:
#   fetch -> verify -> rebuild -> confirm -> commit -> publish
# If verification fails, nothing is rebuilt, committed or published, so the live
# site keeps serving the last figures that passed.

name: Weekly update

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (06:00 Eastern, 07:00 during DST)
  workflow_dispatch:        # plus a "Run workflow" button for doing it by hand

permissions:
  contents: write           # commit the rebuilt page back to the repo
  pages: write              # publish the site
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: 1/4 Fetch every source
        # A failed source keeps nothing half-written; the job goes on so the
        # tests can decide whether what we have is still usable.
        run: PYTHONPATH=src python -m civicalign.agents || echo "FETCH_FAILED=1" >> "$GITHUB_ENV"

      - name: 2/4 Verify the data
        # Checks the numbers themselves. The pages are checked in step 4, AFTER
        # they are rebuilt -- checking them here would fail every week the data
        # moved, even when nothing is wrong.
        run: >
          python -m pytest -q
          --ignore=tests/test_published_pages.py
          --ignore=tests/test_whitepaper.py

      - name: 3/4 Rebuild both pages
        run: PYTHONPATH=src python -m civicalign.build_demo

      - name: 4/4 Confirm the rebuilt pages
        run: python -m pytest -q tests/test_published_pages.py

      - name: Check the hand-written whitepaper (warns, never blocks)
        # WHITEPAPER.md is prose a person wrote. If its figures have moved it
        # needs a person, but a stale essay is no reason to hold back a correct,
        # freshly rebuilt site.
        run: |
          if ! python -m pytest -q tests/test_whitepaper.py; then
            echo "::warning::WHITEPAPER.md quotes figures that have moved. The site"
            echo "::warning::was still published. Update the prose when convenient."
          fi

      - name: Commit the rebuilt page if any figure moved
        run: |
          git config user.name  "civicalign-bot"
          git config user.email "civicalign-bot@users.noreply.github.com"
          git add demo/senator-check.html demo/methodology.html
          if git diff --cached --quiet; then
            echo "No figures moved this week."
          else
            git commit -m "Weekly update: figures refreshed from source data"
            git push
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo

      - name: Flag a partial fetch
        if: env.FETCH_FAILED == '1'
        run: |
          echo "::warning::At least one source could not be fetched. The site was"
          echo "::warning::published from the sources that did update, and the"
          echo "::warning::previous copy of the rest."

  publish:
    needs: update
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
