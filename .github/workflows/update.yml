# Runs the whole update chain in GitHub's cloud every day, then publishes the
# pages. Nothing here depends on any machine being switched on.
#
# THE RULE: the site is always ONE verified snapshot. Every step is a gate.
#    1 fetch      every source into staging; all critical sources succeed or NONE
#                 is installed (the previous snapshot stays intact) and the job fails
#    2 verify     roster, join keys, record counts, no drastic shrinkage
#   Pillar 1 (Engine A), unchanged:
#      bind       Pillar 1 bindings re-derived from this snapshot
#      context    Stage 2.5 records checked against those bindings and this
#                 snapshot's bill status (anything stale fails the run)
#   Pillars 4-6 (Engine B):
#    3 ingest     versioned inputs from the verified snapshot (refuses files that
#                 do not match it); append-only, a new version only on a change
#    4 bridge     record the active public-to-legislator bridge (none-v0, NONE)
#    5 anchors    refresh the three Pillar 4 reference figures from the verified
#                 Voteview file -- visual references only: no calculation reads them
#    6 bills      refresh bill_sponsor_classifications from the verified bill-status
#                 archive (sponsor Bioguide id -> nominate_dim1 sign; fixed rules)
#    7 outcomes   refresh senate_bill_outcomes (passed the Senate, enacted) from the
#                 same archive; unchanged bills write nothing, changed bills append
#    8 check      both bill tables valid, consistent and current with the snapshot
#    9 compute    versioned Pillars 4-6 results, recomputed only where inputs changed
#   10 build      both published pages from the saved results and the newest verified
#                 bill tables -- IN THE WORKSPACE ONLY
#   11 tests      every test, against the pages just built
#   12 supervisor separate code re-reads the raw files and reproduces every number
#   13 commit     only if every step above passed, and only if something changed
#   14 publish    only if every step above passed
#
# THE ORDER IS THE INVARIANT: no test may compare current source data with a page
# generated from a different snapshot, so the build comes before every test, and
# nothing that reads a page runs until the page has been built from the snapshot
# fetched in step 1 (tests/test_update_chain.py pins this).
#
# The bill steps (6-8) read only the verified snapshot: no API call, no model.
#
# Building early is not publishing early. Steps 3-10 only change files in this
# runner's checkout. If any later test or supervisor check fails, the job fails:
# nothing is committed, the publish job does not run, and GitHub Pages keeps
# serving the last verified site.

name: Daily update

on:
  schedule:
    - cron: "0 11 * * *"   # every day 11:00 UTC (06:00 Eastern, 07:00 during DST)
  workflow_dispatch:        # plus a "Run workflow" button for doing it by hand

permissions:
  contents: write           # commit the rebuilt pages and versioned records back to the repo
  pages: write              # publish the site
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: 1/13 Fetch every source as one snapshot (all or nothing)
        # A failed critical source means NO file is replaced and the job stops
        # here. The previous verified snapshot, and the live site, are untouched.
        run: PYTHONPATH=src python -m civicalign.agents

      - name: 2/13 Verify the snapshot (roster, join keys, record counts)
        run: PYTHONPATH=src python -m civicalign.agents.verify

      - name: Pillar 1 -- bind Senate passage votes to their official records (deterministic)
        # Fetches the Senate's own record of each eligible vote and the GovInfo
        # text as voted on, cross-checks them against this snapshot's Voteview
        # and bill status, and writes tracked bindings. A network failure leaves
        # the previous bindings in place (the runner records it; the supervisor
        # judges them); nothing here calls a model.
        run: PYTHONPATH=src python -m civicalign.explain.bind

      - name: Pillar 1 -- Stage 2.5 records belong to this snapshot (fails on anything stale)
        # Every context record and source packet must have been built from the
        # bindings just re-derived and from this snapshot's bill-status
        # summaries. A stale record fails the run rather than mixing a fresh
        # snapshot with old context; a new vote with no context yet has no
        # packet and is only reported.
        run: PYTHONPATH=src python -m civicalign.explain.context --check-fresh

      - name: 3/13 Ingest the versioned Pillars 4-6 inputs from the verified snapshot
        run: PYTHONPATH=src python -m civicalign.ideology.ingest

      - name: 4/13 Record the active bridge (none-v0, status NONE)
        run: PYTHONPATH=src python -m civicalign.ideology.bridge

      - name: 5/13 Refresh the three reference anchors from the verified Voteview file (visual only)
        # The anchors are never an input to any calculation: compute does not
        # read them and they are not part of the result key.
        run: PYTHONPATH=src python -m civicalign.ideology.anchors

      - name: 6/13 Refresh the bill/sponsor classifications from the verified bill-status archive (no API, no model)
        run: PYTHONPATH=src python -m civicalign.ideology.bills

      - name: 7/13 Refresh the passed-Senate and enacted outcomes from the same archive
        run: PYTHONPATH=src python -m civicalign.ideology.bill_outcomes

      - name: 8/13 Verify both bill tables (valid, consistent, current with the snapshot)
        run: PYTHONPATH=src python -m civicalign.ideology.bill_outcomes --verify

      - name: 9/13 Compute the versioned Pillars 4-6 results (only where inputs changed)
        run: PYTHONPATH=src python -m civicalign.ideology.compute

      - name: 10/13 Build both published pages from the saved results and bill tables (workspace only; nothing is published here)
        run: PYTHONPATH=src python -m civicalign.build_pages

      - name: 11/13 Run every test against the pages just built
        run: python -m pytest -q

      - name: 12/13 Supervisor -- independent recount of every published number
        run: PYTHONPATH=src python -m civicalign.agents.supervisor

      - name: 13/13 Commit the pages, versioned records, provenance and bindings (only reached if every gate passed)
        # A day where no source's CONTENT changed produces identical pages and
        # records and an unchanged provenance log; only the snapshot's "last
        # checked" stamp moves, and a timestamp alone is not worth a commit.
        run: |
          git config user.name  "civicalign-bot"
          git config user.email "civicalign-bot@users.noreply.github.com"
          git add demo/senator-check.html demo/methodology.html data/ideology data/ideology/bill_sponsor_classifications.jsonl data/ideology/senate_bill_outcomes.jsonl data/raw/PROVENANCE.tsv data/explanations
          if git diff --cached --quiet; then
            echo "Nothing moved today; the snapshot's check stamp alone is not committed."
            git checkout -- data/raw/SNAPSHOT.json
          else
            git add data/raw/SNAPSHOT.json
            git commit -m "Daily update: pages and records refreshed from a verified source snapshot"
            git push
          fi

      - name: Upload the verified site (the publish job deploys it only if this job succeeded)
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo

  publish:
    # Runs only when every gate in `update` passed. A failure above leaves the
    # previously deployed site in place.
    needs: update
    if: ${{ needs.update.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
