# Runs the whole update chain in GitHub's cloud every week, then publishes the
# pages. This is what moves CivicAlign off a laptop: nothing here depends on any
# machine being switched on.
#
# THE RULE: the site is always ONE verified snapshot. Every step is a gate.
#   1 fetch      every source into staging; all critical sources succeed or NONE
#                is installed (the previous snapshot stays intact) and the job fails
#   2 verify     roster, join keys, record counts, no drastic shrinkage
#   3 data tests recompute every figure from the raw files
#   4 rebuild    both pages from the snapshot
#   5 page tests the public-claim contract (no cross-scale comparisons, no bill
#                ideology, no dead/killed wording, sponsor not bill, etc.)
#   6 supervisor separate code re-reads the raw files and reproduces every figure
#   7 commit     only if the generated pages or the provenance changed
#   8 publish    only if every step above passed
# If any step fails the job fails, nothing is committed, and GitHub Pages keeps
# serving the last verified site.

name: Weekly update

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (06:00 Eastern, 07:00 during DST)
  workflow_dispatch:        # plus a "Run workflow" button for doing it by hand

permissions:
  contents: write           # commit the rebuilt page back to the repo
  pages: write              # publish the site
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: pip install pytest

      - name: 1/6 Fetch every source as one snapshot (all or nothing)
        # A failed critical source means NO file is replaced and the job stops
        # here. The previous verified snapshot, and the live site, are untouched.
        run: PYTHONPATH=src python -m civicalign.agents

      - name: 2/6 Verify the snapshot (roster, join keys, record counts)
        run: PYTHONPATH=src python -m civicalign.agents.verify

      - name: Bind Senate passage votes to their official records (Pillar 1, deterministic)
        # Fetches the Senate's own record of each eligible vote and the GovInfo
        # text as voted on, cross-checks them against Voteview and the bill
        # status, and writes tracked bindings. A network failure leaves the
        # previous bindings in place (the runner records it; the supervisor
        # judges them); nothing here calls a model.
        run: PYTHONPATH=src python -m civicalign.explain.bind

      - name: 3/6 Recompute every figure from the raw files (data tests)
        run: >
          python -m pytest -q
          --ignore=tests/test_published_pages.py
          --ignore=tests/test_whitepaper.py

      - name: 4/6 Rebuild both pages from the snapshot
        run: PYTHONPATH=src python -m civicalign.build_demo

      - name: 5/6 Check the public-claim contract on the rebuilt pages
        run: python -m pytest -q tests/test_published_pages.py

      - name: 6/6 Supervisor -- independent recount of every published figure
        run: PYTHONPATH=src python -m civicalign.agents.supervisor

      - name: Check the hand-written whitepaper (warns, never blocks)
        # WHITEPAPER.md is prose a person wrote. If its figures have moved it
        # needs a person, but a stale essay is no reason to hold back a correct,
        # freshly rebuilt site.
        run: |
          if ! python -m pytest -q tests/test_whitepaper.py; then
            echo "::warning::WHITEPAPER.md quotes figures that have moved. The site"
            echo "::warning::was still published. Update the prose when convenient."
          fi

      - name: Commit the rebuilt pages and provenance if anything substantive changed
        # A week where no source's CONTENT changed produces identical pages and
        # an unchanged provenance log; only the snapshot's "last checked" stamp
        # moves, and a timestamp alone is not worth a commit.
        run: |
          git config user.name  "civicalign-bot"
          git config user.email "civicalign-bot@users.noreply.github.com"
          git add demo/senator-check.html demo/methodology.html data/raw/PROVENANCE.tsv data/explanations
          if git diff --cached --quiet; then
            echo "No figures moved this week; the snapshot's check stamp alone is not committed."
            git checkout -- data/raw/SNAPSHOT.json
          else
            git add data/raw/SNAPSHOT.json
            git commit -m "Weekly update: figures refreshed from a verified source snapshot"
            git push
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo

  publish:
    # Runs only when every gate in `update` passed. A failure above leaves the
    # previously deployed site in place.
    needs: update
    if: ${{ needs.update.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
